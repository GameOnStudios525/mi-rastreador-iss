name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk lld

      - name: Install specific python-for-android tools
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 sh
          pip install git+https://github.com
          pip install git+https://github.com

      - name: Build APK with Auto-Accept Licenses
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiApp-Android
          path: bin/*.apk


